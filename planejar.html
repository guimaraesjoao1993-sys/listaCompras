<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Planejar Compras</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 p-4 pb-20 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        
        <header class="flex justify-between items-center">
            <a href="index.html" class="text-indigo-600 font-bold text-[10px] uppercase">← Painel</a>
            <h1 class="font-black text-indigo-900 uppercase text-lg italic tracking-tighter">Planejar Compras</h1>
        </header>

        <!-- PAINEL DE INCLUSÃO -->
        <div class="bg-white p-4 rounded-3xl shadow-md border border-indigo-100 space-y-3">
            <p class="text-[10px] font-black uppercase tracking-widest text-indigo-400">Adicionar à Lista</p>
            
            <!-- 1. Quantidade primeiro, depois Produto -->
            <div class="flex gap-2">
                <div class="w-1/3">
                    <label class="text-[8px] font-black uppercase text-indigo-400 ml-1">Qtd</label>
                    <input type="text" id="qtd" value="1" class="w-full p-3 rounded-2xl bg-indigo-50/50 border border-indigo-100 font-bold text-center text-sm outline-none focus:ring-2 ring-indigo-500">
                </div>
                <div class="w-2/3">
                    <label class="text-[8px] font-black uppercase text-indigo-400 ml-1">Produto</label>
                    <input type="text" id="busca" placeholder="Digite o produto..." oninput="verificarDigitacao()" class="w-full p-3 rounded-2xl bg-indigo-50/50 border border-indigo-100 font-bold text-sm outline-none focus:ring-2 ring-indigo-500">
                </div>
            </div>

            <!-- Sugestões do Banco Master -->
            <div id="sugestoes" class="hidden max-h-40 overflow-y-auto space-y-1 bg-white p-2 rounded-2xl border border-indigo-100 shadow-inner"></div>

            <!-- AVISO E ESCOLHA DE CATEGORIA PARA ITEM NOVO -->
            <div id="painel-item-novo" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-2xl space-y-2">
                <div class="flex items-center gap-2">
                    <span class="text-amber-500 text-xs">✨</span>
                    <span class="text-[10px] font-black uppercase text-amber-700">Novo Produto Detectado</span>
                </div>
                <p class="text-[11px] text-amber-900 leading-tight">Esse item ainda não está no banco. Escolha a categoria:</p>
                <select id="cat-novo-item" class="w-full bg-white p-2.5 rounded-xl border border-amber-300 text-xs font-bold uppercase text-amber-900 outline-none"></select>
            </div>

            <div>
                <label class="text-[8px] font-black uppercase text-indigo-400 ml-1">Observação (Opcional)</label>
                <input type="text" id="obs" placeholder="Ex: Marca específica, bem maduro..." class="w-full p-3 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-xs font-medium outline-none">
            </div>

            <button onclick="adicionarItem()" class="w-full bg-indigo-600 text-white p-3.5 rounded-2xl font-black uppercase text-xs tracking-wider shadow-lg active:scale-95 transition-all">
                + Adicionar Item
            </button>
        </div>

        <!-- LISTA DO PLANEJAMENTO (ORDEM ALFABÉTICA COM CONTROLE DE QTD) -->
        <div class="flex justify-between items-center pt-2">
            <span id="contador-itens" class="text-[10px] font-black uppercase text-indigo-400">0 itens na lista</span>
            <a href="mercado.html" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-md">Ir ao Mercado →</a>
        </div>

        <div id="lista-planejada" class="space-y-3"></div>
    </div>

    <script>
        if(localStorage.getItem('acesso_lista') !== 'autorizado') {
            window.location.href = "index.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD4jdw3dkSl-63iyBypdip4NXUah2mdie8",
            authDomain: "rag-final-474711.firebaseapp.com",
            databaseURL: "https://rag-final-474711-default-rtdb.firebaseio.com",
            projectId: "rag-final-474711",
            storageBucket: "rag-final-474711.firebasestorage.app",
            messagingSenderId: "281529599553",
            appId: "1:281529599553:web:2e466ab204c1dc7210a8c0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let bancoMaster = [];
        let categorias = [];

        function limpar(s) { 
            return s ? s.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : ""; 
        }

        // Carregar Categorias
        db.ref('categorias').on('value', s => {
            const val = s.val() || {};
            categorias = Object.values(val).sort();
            
            const selectNovo = document.getElementById('cat-novo-item');
            selectNovo.innerHTML = categorias.map(c => `<option value="${c}">${c}</option>`).join('');
        });

        // Carregar Banco Master
        db.ref('inventario_mestre').on('value', s => {
            const raw = s.val() || {};
            bancoMaster = Object.entries(raw).map(([id, v]) => ({
                id, 
                nome: typeof v === 'object' ? v.nome : v, 
                cat: v.cat || "Geral"
            }));
        });

        function verificarDigitacao() {
            const txt = limpar(document.getElementById('busca').value);
            const box = document.getElementById('sugestoes');
            const painelNovo = document.getElementById('painel-item-novo');

            if (!txt) { 
                box.classList.add('hidden'); 
                painelNovo.classList.add('hidden');
                return; 
            }

            const achados = bancoMaster.filter(p => limpar(p.nome).includes(txt)).slice(0, 5);
            const existeExato = bancoMaster.some(p => limpar(p.nome) === txt);
            
            if (achados.length > 0) {
                box.innerHTML = achados.map(p => `
                    <div onclick="selecionarSugestao('${p.id}', '${p.nome.replace(/'/g, "\\'")}', '${p.cat.replace(/'/g, "\\'")}')" class="p-2.5 hover:bg-indigo-50 rounded-xl cursor-pointer flex justify-between items-center text-xs">
                        <span class="font-bold text-indigo-950">${p.nome}</span>
                        <span class="text-[9px] bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-md uppercase font-black">${p.cat}</span>
                    </div>
                `).join('');
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }

            if (!existeExato && txt.length >= 2) {
                painelNovo.classList.remove('hidden');
            } else {
                painelNovo.classList.add('hidden');
            }
        }

        function selecionarSugestao(idMaster, nome, cat) {
            const qtd = document.getElementById('qtd').value || "1";
            const obs = document.getElementById('obs').value;
            const itemId = "item_" + Date.now();
            
            db.ref('compra_atual/' + itemId).set({
                nome, cat, qtd, obs, comprado: false, timestamp: Date.now()
            });

            limparCampos();
        }

        function adicionarItem() {
            const nomeInput = document.getElementById('busca').value.trim();
            if (!nomeInput) return;

            const qtd = document.getElementById('qtd').value || "1";
            const obs = document.getElementById('obs').value;
            const itemId = "item_" + Date.now();

            const produtoExistente = bancoMaster.find(p => limpar(p.nome) === limpar(nomeInput));
            let catFinal = "Geral";

            if (produtoExistente) {
                catFinal = produtoExistente.cat;
            } else {
                catFinal = document.getElementById('cat-novo-item').value || "Geral";
                const idMaster = btoa(unescape(encodeURIComponent(nomeInput))).replace(/=/g, "");
                db.ref('inventario_mestre/' + idMaster).set({ nome: nomeInput, cat: catFinal });
            }

            db.ref('compra_atual/' + itemId).set({
                nome: nomeInput, 
                cat: catFinal, 
                qtd, 
                obs, 
                comprado: false,
                timestamp: Date.now()
            });

            limparCampos();
        }

        function limparCampos() {
            document.getElementById('busca').value = '';
            document.getElementById('obs').value = '';
            document.getElementById('qtd').value = '1';
            document.getElementById('sugestoes').classList.add('hidden');
            document.getElementById('painel-item-novo').classList.add('hidden');
        }

        function alterarCategoriaItem(itemId, novaCategoria) {
            db.ref('compra_atual/' + itemId).update({ cat: novaCategoria });
        }

        // FUNÇÕES DE ALTERAÇÃO RÁPIDA DE QUANTIDADE
        function alterarQtdRelativa(itemId, qtdAtual, delta) {
            let num = parseInt(qtdAtual);
            if (isNaN(num)) {
                num = 1;
            }
            num += delta;
            if (num < 1) num = 1;
            db.ref('compra_atual/' + itemId).update({ qtd: String(num) });
        }

        function alterarQtdTexto(itemId, novaQtd) {
            if (!novaQtd.trim()) return;
            db.ref('compra_atual/' + itemId).update({ qtd: novaQtd });
        }

        // Renderizar Lista (ORDEM ALFABÉTICA)
        db.ref('compra_atual').on('value', s => {
            const val = s.val() || {};
            const box = document.getElementById('lista-planejada');
            box.innerHTML = '';

            const itens = Object.entries(val).map(([id, v]) => ({ id, ...v }));
            document.getElementById('contador-itens').innerText = `${itens.length} itens na lista`;

            if (itens.length === 0) {
                box.innerHTML = '<div class="text-center py-10 text-indigo-300 font-bold uppercase text-xs">Sua lista está vazia</div>';
                return;
            }

            itens.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR', { sensitivity: 'base' }));

            itens.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-indigo-100 flex flex-col gap-2";
                
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <!-- Controle Interativo de Quantidade -->
                            <div class="flex items-center bg-indigo-50 rounded-xl border border-indigo-100 p-1">
                                <button onclick="alterarQtdRelativa('${item.id}', '${item.qtd}', -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded-lg text-indigo-600 font-black text-xs shadow-sm active:scale-90">-</button>
                                <input type="text" value="${item.qtd}" onchange="alterarQtdTexto('${item.id}', this.value)" class="w-10 text-center bg-transparent font-black text-xs text-indigo-900 outline-none">
                                <button onclick="alterarQtdRelativa('${item.id}', '${item.qtd}', 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded-lg text-indigo-600 font-black text-xs shadow-sm active:scale-90">+</button>
                            </div>
                            <div>
                                <b class="text-sm text-gray-800">${item.nome}</b>
                                ${item.obs ? `<p class="text-[10px] text-indigo-500 italic">${item.obs}</p>` : ''}
                            </div>
                        </div>
                        <button onclick="db.ref('compra_atual/${item.id}').remove()" class="text-red-400 p-2 font-bold text-sm hover:text-red-600">✕</button>
                    </div>

                    <div class="flex items-center gap-2 pt-1 border-t border-indigo-50/80">
                        <span class="text-[9px] font-black uppercase text-indigo-300">Cat:</span>
                        <select onchange="alterarCategoriaItem('${item.id}', this.value)" class="flex-1 bg-indigo-50/60 p-1.5 rounded-xl text-[10px] font-black uppercase text-indigo-700 outline-none">
                            ${categorias.map(c => `<option value="${c}" ${item.cat === c ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                    </div>
                `;
                box.appendChild(div);
            });
        });
    </script>
</body>
</html>
